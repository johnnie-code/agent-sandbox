<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GN dock</title>
<style>
  :root{--gn-copper:#B87333;--gn-platinum:#E8E8E8;--gn-silver:#C8C8C8;--gn-ink:#080808;--gn-soft:#F5F5F5}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#E8E8E8;padding:28px}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#E8E8E8;opacity:.7;margin:0 0 18px;font-weight:600}
  .row{display:flex;gap:22px;align-items:flex-start}
  .phone{width:330px;height:560px;border-radius:34px;background:var(--gn-ink);position:relative;overflow:hidden;border:1px solid #ffffff14;flex:0 0 auto}
  .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#B87333;margin:10px 0 0 6px}
  .content{padding:22px;opacity:.35;font-size:13px;line-height:1.6}
  .content b{display:block;font-size:17px;opacity:.9;margin-bottom:6px;font-weight:600}
  /* the shared dock, exactly the numbers now in index.css */
  .gn-seller-nav{position:absolute;display:flex;align-items:stretch;justify-content:space-between;left:50%;transform:translateX(-50%);bottom:16px;background:var(--gn-ink);color:var(--gn-silver);border:1px solid #E8E8E82E;border-radius:26px;box-shadow:0 8px 32px #080808;padding:6px;gap:4px;width:min(calc(100% - 24px),440px)}
  .gn-seller-nav>button{flex:1;min-width:58px;min-height:64px;border-radius:18px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:0 8px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
  .gn-seller-nav>button[aria-current]{background:var(--gn-soft);color:var(--gn-copper)}
  .gn-seller-nav button span{display:block;font-size:11px;font-weight:500;line-height:1}
  .gn-seller-nav svg{width:24px;height:24px}
  .gn-dock-item{min-height:64px}
  .gn-dock-item.is-active{background:var(--gn-soft)}
  .gn-dock-label{letter-spacing:0}
  /* buyer dock: island plus the agent button, same item box */
  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;width:calc(100% - 24px);max-width:460px;gap:8px;align-items:stretch}
  .island{flex:1;display:flex;align-items:stretch;gap:4px;border-radius:26px;border:1px solid #ffffff17;padding:6px;background:rgba(16,16,16,.86);backdrop-filter:blur(24px) saturate(170%);box-shadow:0 1px 0 #ffffff0d inset,0 14px 40px #0000009e}
  .item{position:relative;flex:1;min-width:58px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:18px;background:none;color:#ffffff8c;font:inherit;cursor:pointer;padding:0 8px}
  .item.is-active{background:var(--gn-soft);color:var(--gn-copper)}
  .item svg{width:24px;height:24px}
  .item span{font-size:11px;font-weight:500;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ace{width:68px;flex:0 0 auto;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;border:1px solid #ffffff17;background:rgba(16,16,16,.86);color:#ffffffd9;font:inherit;cursor:pointer}
  .dot{position:absolute;top:10px;right:14px;width:5px;height:5px;border-radius:50%;background:var(--gn-copper);box-shadow:0 0 0 2px rgba(16,16,16,.9)}
  /* admin: seven tabs, scrollable, labels visible */
  .adm{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:stretch;gap:4px;width:calc(100% - 24px);max-width:520px;overflow-x:auto;border-radius:26px;border:1px solid #ffffff17;padding:6px;background:rgba(16,16,16,.86);backdrop-filter:blur(24px) saturate(170%)}
  .adm::-webkit-scrollbar{display:none}
  .adm .item{flex:0 0 60px;min-width:60px;padding:0 2px}
  .adm .item span{font-size:10px}
  .rail{width:104px;height:640px;border-radius:20px;background:rgba(8,8,8,.94);border:1px solid #ffffff12;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 0}
  .rail button{margin-top:4px;width:80px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:14px;padding:12px 0;background:none;border:0;color:#ffffff59;font:inherit;cursor:pointer;position:relative}
  .rail button.is-active{background:#ffffff12;color:#fff}
  .rail svg{width:24px;height:24px}
  .rail span{font-size:11px;letter-spacing:.2px;line-height:1}
</style></head>
<body>
<h1>GN bottom navigation, rendered from the merged markup and styles</h1>
<div class="row">

  <div>
    <div class="phone">
      <div class="content"><b>Discover</b>Buyer shop. Real catalogue, no filler.</div>
      <div class="dock">
        <div class="island">
          <button class="item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M9 20v-6h6v6"/></svg><span>Discover</span></button>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2l1.5 4h9L18 2M3 6h18l-2 14H5L3 6z"/></svg><span>Feed</span><i class="dot"></i></button>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg><span>Wishlist</span></button>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0114 0"/></svg><span>Profile</span></button>
        </div>
        <button class="ace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z"/></svg><span>Agent</span></button>
      </div>
    </div>
    <p class="cap">Buyer, 390px</p>
  </div>

  <div>
    <div class="phone">
      <div class="content"><b>Your shop</b>Seller workspace. Orders, products, money.</div>
      <nav class="gn-seller-nav">
        <button aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Home</span></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h12l2 6H4l2-6zM5 8v13h14V8"/></svg><span>Orders</span></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg><span>Products</span></button>
        <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></button>
      </nav>
    </div>
    <p class="cap">Seller, 390px</p>
  </div>

  <div>
    <div class="phone">
      <div class="content"><b>Overview</b>Admin. Seven areas, all labelled.</div>
      <div class="adm">
        <button class="item is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span>Overview</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M17 11a3 3 0 100-6"/></svg><span>Users</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M17 7H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg><span>Revenue</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Finance</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="12" r="3"/><path d="M14 12h7M18 9v6"/></svg><span>Staff</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H8l-4 4V5z"/></svg><span>Agent</span></button>
        <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h10M4 12h16M4 17h7"/></svg><span>Settings</span></button>
      </div>
    </div>
    <p class="cap">Admin, 390px</p>
  </div>


</div>
  <div>
    <div class="rail" style="margin-top:26px">
      <button class="is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Home</span></button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h12l2 6H4l2-6zM5 8v13h14V8"/></svg><span>Orders</span></button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l9-4 9 4-9 4-9-4z"/></svg><span>Products</span></button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></button>
    </div>
    <p class="cap">Desktop rail, 104px</p>
  </div>

</body></html>
